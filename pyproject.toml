[project]
name = "poker-self-play"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end training runs; minutes rather than seconds",
]
